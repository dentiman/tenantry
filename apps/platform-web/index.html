<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenantry — Control plane</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Палітра — ДО першого малювання, інакше кожне завантаження показувало б кадр
      дефолтної теми. Дзеркало apps/web/index.html; ключ мусить збігатися зі
      `storageKey` у <UiThemeProvider> нижче.
    -->
    <script>
      try {
        var palette = localStorage.getItem('saas_platform_theme_palette');
        if (palette && /^[a-z-]{1,20}$/.test(palette)) {
          document.documentElement.dataset.theme = palette;
        }
      } catch (e) {
        /* приватний режим — лишиться дефолтна тема */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

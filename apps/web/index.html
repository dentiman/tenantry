<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenantry — multitenant CRM/ERP foundation</title>
    <meta
      name="description"
      content="Production-shaped foundation for multitenant CRM/ERP SaaS products: tenant app and operator control plane, Postgres row-level security, typed contracts, realtime."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tenantry" />
    <meta property="og:title" content="Tenantry — multitenant CRM/ERP foundation" />
    <meta
      property="og:description"
      content="Live demo of a production-shaped foundation for multitenant CRM/ERP SaaS products."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Палітра — ДО першого малювання, інакше кожне завантаження показувало б кадр
      дефолтної теми. Клас світло/темрява так само вставляє next-themes своїм
      скриптом; це його дзеркало для другої осі (docs/frontend/theming.md).
      Ключ мусить збігатися зі `storageKey` у <UiThemeProvider>; значення
      просіюється СПИСКОМ відомих палітр, а не регуляркою форми. Список —
      дзеркало реєстру (`libs/ui/src/themes/registry.ts`), і його не можна
      замінити назад на регулярку: id теми переживає перейменування в
      localStorage, а невідомий `data-theme` не підхопить жодна тема — до
      гідратації сторінка лишилась би з самою спільною базою токенів.
    -->
    <script>
      try {
        var palette = localStorage.getItem('saas_theme_palette');
        if (['tenantry', 'gray'].indexOf(palette) !== -1) {
          document.documentElement.dataset.theme = palette;
        }
      } catch (e) {
        /* приватний режим — лишиться дефолтна тема */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

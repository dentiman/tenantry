# Docker Swarm stack — усі сервіси saas-skeleton на ОДНІЙ manager-ноді (single-node старт).
# Деплой (через docker context, БЕЗ файлів на сервері):
#   DOCKER_CONTEXT=swarm docker stack deploy --with-registry-auth -c docker/docker-compose.stack.yml saas
#
# Змінні ${...} інтерполюються КЛІЄНТСЬКИ (на раннері) з оточення CI перед відправкою на manager:
#   образи:  API_IMAGE PLATFORM_API_IMAGE WORKER_IMAGE WEB_IMAGE PLATFORM_WEB_IMAGE
#   секрети: JWT_SECRET PLATFORM_JWT_SECRET S3_ACCESS_KEY S3_SECRET_KEY S3_ENDPOINT
#            S3_CORS_ALLOWED_ORIGINS SMTP_HOST SMTP_FROM POSTGRES_PASSWORD
#            ENCRYPTION_KEY (AUTH-3, api+worker) APP_PUBLIC_URL (AUTH-3, worker)
#
# Стан (postgres/seaweedfs) прибито до manager (Варіант B): volume local+bind у /srv →
# бекап = весь сервер. Режим IP:port БЕЗ проксі: web/platform-web/seaweedfs — mode:host на 0.0.0.0
# (браузер б'є їх напряму за <node-ip>:порт, S3 — теж напряму за presigned URL, БЕЗ TLS);
# api/platform-api лишаються на 127.0.0.1 (браузер ходить до них через nginx-проксі web по overlay).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Спільний deploy для ВСІХ сервісів: single-node, прибито до manager, 1 репліка.
x-deploy: &deploy-pinned
  replicas: 1
  placement:
    constraints:
      - node.role == manager
      # За кількох нод розкоментуй і зафіксуй конкретну storage-ноду:
      # - node.hostname == DOCKER-PROD-01
  restart_policy:
    condition: on-failure
    delay: 5s

# Rolling update для STATELESS-апок: піднімай новий таск ДО зупинки старого + автооткат.
x-update-stateless: &update-stateless
  parallelism: 1
  delay: 10s
  order: start-first
  failure_action: rollback

# Для STATEFUL (postgres/seaweedfs): stop-first — двом інстансам НЕ можна ділити один volume.
x-update-stateful: &update-stateful
  parallelism: 1
  order: stop-first

# Для сервісів з host-mode портом (web/platform-web): start-first НЕМОЖЛИВИЙ — новий таск
# не забіндить порт, який ще тримає старий на тій самій ноді, і зависне в Pending НАЗАВЖДИ
# ("host-mode port already in use on 1 node"), а сервіс тихо лишиться на старому образі.
# Ціна stop-first — кілька секунд недоступності на рестарт nginx.
x-update-hostport: &update-hostport
  parallelism: 1
  delay: 10s
  order: stop-first
  failure_action: rollback

# DB-URL-и: паролі ролей фіксовані в ensure-roles.ts (postgres внутрішній, порт не публікується).
x-db-env: &db-env
  DATABASE_URL: postgresql://saas_app:saas_app@postgres:5432/saas_skeleton
  MIGRATE_DATABASE_URL: postgresql://saas_migrator:saas_migrator@postgres:5432/saas_skeleton
  PLATFORM_DATABASE_URL: postgresql://saas_platform:saas_platform@postgres:5432/saas_skeleton

# Доступ до брокера. Потрібен ОБОМ процесам, але з різних причин: api тримає на
# ньому adapter і presence-leases, воркер — лише headless-емітер сповіщень
# (docs/notifications.md § «Міст із воркера»). Префікс мусить збігатися: з нього
# рахується ім'я стріму, і розійшовшись, процеси писали б у різні (тихо, без помилки).
x-realtime-broker-env: &realtime-broker-env
  REDIS_URL: redis://:${REDIS_PASSWORD}@valkey:6379
  REALTIME_KEY_PREFIX: ${REALTIME_KEY_PREFIX:-saas:rt}

# RT-0: решта realtime-конфігу — суто api-шна (гейтвей, presence)
x-realtime-env: &realtime-env
  <<: *realtime-broker-env
  REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS}
  REALTIME_LEASE_TTL_MS: ${REALTIME_LEASE_TTL_MS:-60000}
  REALTIME_HEARTBEAT_MS: ${REALTIME_HEARTBEAT_MS:-20000}
  REALTIME_RECOVERY_MS: ${REALTIME_RECOVERY_MS:-120000}
  REALTIME_LAST_SEEN_MARK_MS: ${REALTIME_LAST_SEEN_MARK_MS:-300000}
  REALTIME_LAST_SEEN_FLUSH_MS: ${REALTIME_LAST_SEEN_FLUSH_MS:-15000}

x-ai-env: &ai-env
  # Спільний блок для api і worker — api читає лише прапорець і межі, а генерує
  # ВИКЛЮЧНО worker. Ключа провайдера тут НЕМАЄ свідомо: він у x-ai-provider-env,
  # який отримує лише worker (ai-1a, docs/ai-assistant-implementation.md)
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_PROVIDER: ${AI_PROVIDER:-fake}
  AI_MODEL: ${AI_MODEL:-}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
  AI_HISTORY_TURNS: ${AI_HISTORY_TURNS:-10}
  AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
  AI_STREAM_FLUSH_MS: ${AI_STREAM_FLUSH_MS:-120}
  AI_PARTIAL_PERSIST_MS: ${AI_PARTIAL_PERSIST_MS:-2000}
  AI_ASK_LIMIT_PER_MINUTE: ${AI_ASK_LIMIT_PER_MINUTE:-10}
  AI_PROVIDER_RETRIES: ${AI_PROVIDER_RETRIES:-1}
  AI_RETRY_DELAY_MS: ${AI_RETRY_DELAY_MS:-2000}

# ai-1a: облік реального бекенду — ЛИШЕ worker. Порожні значення легальні, поки
# AI_PROVIDER=fake; з openai-compat і AI_ENABLED=true worker без них не стартує.
# ПЕРЕД тим як задати AI_API_KEY — жорстка місячна стеля витрат на ключі в кабінеті
# провайдера (docs/deploy-swarm.md §7, обовʼязково, поки немає квот ai-1d)
x-ai-provider-env: &ai-provider-env
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-saas-files}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS}

services:
  # ------------------------------------------------------------------ postgres
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas}
      POSTGRES_DB: ${POSTGRES_DB:-saas_skeleton}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [saas_net]
    logging: *logging
    # Порт НЕ публікуємо — доступ лише зсередини overlay (postgres:5432)
    deploy:
      <<: *deploy-pinned
      update_config: *update-stateful
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas} -d ${POSTGRES_DB:-saas_skeleton}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ seaweedfs (S3)
  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    command: 'server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024'
    volumes:
      - seaweedfs-data:/data
    configs:
      - source: s3_config
        target: /etc/seaweedfs/s3.json
    networks: [saas_net]
    logging: *logging
    ports:
      # Браузер ходить сюди за presigned URL через зовнішній reverse-proxy (зберігати Host — SigV4!)
      - target: 8333
        published: 8503
        mode: host              # bind 0.0.0.0 (host_ip не підтримує схема stack deploy) — S3 напряму браузеру
    deploy:
      <<: *deploy-pinned
      update_config: *update-stateful

  # ------------------------------------------------------------------ valkey (realtime broker)
  # RT-0. Порт НЕ публікується — доступ лише по overlay (valkey:6379).
  # Персистентності немає (presence ефемерна) → volume не потрібен, а отже
  # stop-first тут не через спільний volume, а тому що інстанс один.
  valkey:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'no'
      - --save
      - ''
    environment:
      VALKEY_PASSWORD: ${REDIS_PASSWORD}
    networks: [saas_net]
    logging: *logging
    deploy:
      <<: *deploy-pinned
      update_config: *update-stateful
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ api (listen :3001 → published :8501)
  api:
    image: ${API_IMAGE}
    # Override: спершу міграції (saas_migrator), потім старт (saas_app)
    entrypoint: ["/usr/src/app/docker/entrypoint-api.sh"]
    environment:
      <<: [*db-env, *s3-env, *realtime-env, *ai-env]
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      # AUTH-1: сесія-пристрій замість рядка refresh-токена
      AUTH_SESSION_IDLE_DAYS: ${AUTH_SESSION_IDLE_DAYS:-7}
      AUTH_SESSION_ABSOLUTE_DAYS: ${AUTH_SESSION_ABSOLUTE_DAYS:-30}
      AUTH_REUSE_REVOKES_ALL_SESSIONS: ${AUTH_REUSE_REVOKES_ALL_SESSIONS:-false}
      # AUTH-2: refresh у httpOnly cookie — тестовий прод по http (без TLS)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # AUTH-3: шифрує токени одноразових посилань перед публікацією (план D-11)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    networks: [saas_net]
    logging: *logging
    # RT-1: на SIGTERM api звільняє presence-leases і закриває sockets. Дефолтних 10 с
    # вистачає, але запас робить drain передбачуваним при повільному Valkey.
    stop_grace_period: 30s
    # порт не публікуємо — api доступний по overlay (web nginx проксить /api → api:3001)
    deploy:
      <<: *deploy-pinned
      update_config: *update-stateless
      rollback_config:
        parallelism: 1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ------------------------------------------------------------------ platform-api (listen :3002 → published :8502)
  platform-api:
    image: ${PLATFORM_API_IMAGE}
    environment:
      # AUTH-2 (R-15): platform-api — другий споживач throttler-а на Valkey,
      # тому *realtime-broker-env тут, а не тільки *db-env
      <<: [*db-env, *realtime-broker-env]
      NODE_ENV: production
      PLATFORM_PORT: 3002
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      PLATFORM_JWT_ACCESS_EXPIRES_IN: ${PLATFORM_JWT_ACCESS_EXPIRES_IN:-15m}
      # AUTH-0: tenant-api CORS бере REALTIME_ALLOWED_ORIGINS з *realtime-env; тут — свій origin
      PLATFORM_CORS_ALLOWED_ORIGINS: ${PLATFORM_CORS_ALLOWED_ORIGINS}
      # AUTH-2: сесія-пристрій control plane — той самий каркас, що tenant-api
      AUTH_SESSION_IDLE_DAYS: ${AUTH_SESSION_IDLE_DAYS:-7}
      AUTH_SESSION_ABSOLUTE_DAYS: ${AUTH_SESSION_ABSOLUTE_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks: [saas_net]
    logging: *logging
    # порт не публікуємо — platform-api по overlay (platform-web nginx проксить /api → platform-api:3002)
    deploy:
      <<: *deploy-pinned
      update_config: *update-stateless
      rollback_config:
        parallelism: 1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ------------------------------------------------------------------ worker (без HTTP)
  worker:
    image: ${WORKER_IMAGE}
    environment:
      <<: [*db-env, *s3-env, *realtime-broker-env, *ai-env, *ai-provider-env]
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM}
      # AUTH-3: розшифровує токен одноразового посилання лише в пам'яті перед рендером листа;
      # той самий ключ, що в api — інакше воркер не прочитає власний payload
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Базовий URL tenant-web для лінків у листах (reset-password/confirm-email)
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
    networks: [saas_net]
    logging: *logging
    deploy:
      <<: *deploy-pinned
      update_config: *update-stateless
      rollback_config:
        parallelism: 1
    # healthcheck немає: воркер без HTTP (живе на poll-циклах pg-boss); стан — через docker service ps

  # ------------------------------------------------------------------ web (published :8511)
  web:
    image: ${WEB_IMAGE}
    environment:
      API_UPSTREAM: http://api:3001
    networks: [saas_net]
    logging: *logging
    ports:
      - target: 80
        published: 8511
        mode: host              # bind 0.0.0.0 — браузер відкриває web напряму
    deploy:
      <<: *deploy-pinned
      update_config: *update-hostport
      rollback_config:
        parallelism: 1

  # ------------------------------------------------------------------ platform-web (published :8512)
  platform-web:
    image: ${PLATFORM_WEB_IMAGE}
    environment:
      API_UPSTREAM: http://platform-api:3002
    networks: [saas_net]
    logging: *logging
    ports:
      - target: 80
        published: 8512
        mode: host              # bind 0.0.0.0 — браузер відкриває platform-web напряму
    deploy:
      <<: *deploy-pinned
      update_config: *update-hostport
      rollback_config:
        parallelism: 1

networks:
  saas_net:
    driver: overlay
    attachable: true   # щоб one-shot db:roles/db:seed (docker run) могли під'єднатись

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SAAS_DATA_DIR:-/srv/saas-skeleton/data}/postgres
  seaweedfs-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SAAS_DATA_DIR:-/srv/saas-skeleton/data}/seaweedfs

configs:
  s3_config:
    # Читається на раннері (client-side), відправляється в swarm як config-обʼєкт.
    # Шлях ВІДНОСНО теки цього stack-файлу (docker/), а НЕ від кореня репо —
    # docker stack deploy резолвить configs.file від директорії compose-файлу.
    file: ./seaweedfs/s3.prod.json

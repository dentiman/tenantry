name: saas-skeleton

services:
  postgres:
    image: postgres:17-alpine
    container_name: saas-skeleton-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas}
      POSTGRES_DB: ${POSTGRES_DB:-saas_skeleton}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # MT-0: ролі saas_migrator/saas_app/saas_platform. Виконується ЛИШЕ на порожньому volume;
      # для наявного — `pnpm db:roles` (docs/multi-tenancy-migration.md, MT-0)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  mailpit:
    image: axllent/mailpit:latest
    container_name: saas-skeleton-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP — сюди шле apps/worker
      - '${MAILPIT_UI_PORT:-8025}:8025' # веб-UI — перегляд листів у dev

  # Realtime (RT-0): брокер Socket.IO Redis Streams adapter + сховище presence-leases.
  # Valkey — RESP-сумісний форк Redis (BSD); прод — той самий образ або managed-сервіс.
  # Персистентність ВИМКНЕНА свідомо: presence ефемерна, adapter-стрім bounded, після
  # рестарту стан відбудовується heartbeat-ами (docs/realtime.md § «Інфраструктура»).
  # noeviction — тиха eviction presence-ключів гірша за явну помилку.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: saas-skeleton-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD:-saas-realtime}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'no'
      - --save
      - ''
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      VALKEY_PASSWORD: ${REDIS_PASSWORD:-saas-realtime}

  # S3-сумісне файлове сховище (файли CRM: документи, зображення).
  # Обраний SeaweedFS (Apache 2.0, зрілий); MinIO не використовуємо — репо заархівовано 04/2026.
  # Публікується ТІЛЬКИ S3-порт 8333 — master/volume/filer лишаються всередині контейнера.
  seaweedfs:
    image: chrislusf/seaweedfs:latest # прод: зафіксувати конкретний тег
    container_name: saas-skeleton-s3
    restart: unless-stopped
    command: 'server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256'
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  seaweedfs-data:

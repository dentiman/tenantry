name: saas-skeleton

services:
  postgres:
    image: postgres:17-alpine
    container_name: saas-skeleton-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas}
      POSTGRES_DB: ${POSTGRES_DB:-saas_skeleton}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

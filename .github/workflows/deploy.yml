# CI/CD для GitHub: build → deploy на Hetzner (docs/deploy-hetzner.md). Деплоїться гілка `main`.
#
# Паралельно існує GitLab-пайплайн (.gitlab-ci.yml, стенд saas-dev); вони незалежні.
#
# Перевірки (verify) тут НЕМАЄ: стенд ще не прод, тож шлюзом є локальна `pnpm release:hetzner`
# (verify → push). Той самий прогін на GitHub-hosted лишився кнопкою — verify.yml; як повернути
# його шлюзом — у шапці verify.yml.
#
# Обидві джоби — на self-hosted runner-і, що стоїть НА Hetzner-вузлі (label `hetzner`):
# образи збираються локально й у registry не пушаться, деплой іде в локальний Docker.
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Новий пуш не скасовує розкат, що вже йде, — він стає в чергу (одна «очікуюча» заміна на групу)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, hetzner]
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 1 # один вузол 2 vCPU / 4 ГБ: паралельні збірки впираються в пам'ять
      matrix:
        include:
          - { image: api, dockerfile: Dockerfile.node, app: api }
          - { image: platform-api, dockerfile: Dockerfile.node, app: platform-api }
          - { image: worker, dockerfile: Dockerfile.node, app: worker }
          - { image: web, dockerfile: Dockerfile.web, app: web }
          - { image: platform-web, dockerfile: Dockerfile.web, app: platform-web }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # номер збірки tenant-web = кількість комітів (scripts/build-info.ts)
      - name: Build ${{ matrix.image }}
        env:
          DOCKER_BUILDKIT: "1"
          DOCKERFILE: ${{ matrix.dockerfile }}
          APP: ${{ matrix.app }}
          TAG: saas/${{ matrix.image }}:${{ github.sha }}
        run: |
          args=(--build-arg APP="$APP")
          if [ "$DOCKERFILE" = Dockerfile.web ]; then
            args+=(--build-arg APP_BUILD_NUMBER="$(git rev-list --count HEAD)" --build-arg APP_GIT_SHA="$(git rev-parse --short HEAD)")
          fi
          docker build -f "$DOCKERFILE" "${args[@]}" -t "$TAG" .

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, hetzner]
    timeout-minutes: 45
    # Один розкат за раз, і не одночасно з ops-операціями (спільна група з ops.yml)
    concurrency:
      group: saas-prod-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Deploy stack
        run: bash scripts/hetzner/deploy.sh

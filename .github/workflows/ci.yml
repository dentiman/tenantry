name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://saas:saas@localhost:5432/saas_skeleton
      JWT_SECRET: ci-only-secret-not-for-production-min-32-chars
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas_skeleton
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: API e2e tests
        run: pnpm api:test:e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # MT-0: runtime — saas_app, міграції — saas_migrator (ролі створює крок db:roles)
      DATABASE_URL: postgresql://saas_app:saas_app@localhost:5432/saas_skeleton
      MIGRATE_DATABASE_URL: postgresql://saas_migrator:saas_migrator@localhost:5432/saas_skeleton
      POSTGRES_ADMIN_URL: postgresql://saas:saas@localhost:5432/postgres
      JWT_SECRET: ci-only-secret-not-for-production-min-32-chars
      PLATFORM_JWT_SECRET: ci-only-platform-secret-not-for-production-32chars
      # RT-0: presence і Socket.IO adapter живуть у Valkey. E2E ходять до нього
      # по-справжньому — Lua-скрипти присутності не мають сенсу проти фейка
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas_skeleton
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Без пароля свідомо: `services` у GitHub Actions не вміє передавати аргументи
      # серверу (`options` — це прапорці `docker create`), а сам сервіс ефемерний і
      # доступний лише job-у. У dev/проді пароль обовʼязковий — див. docker-compose.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Ensure DB roles (MT-0)
        run: pnpm db:roles

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: API e2e tests
        run: pnpm api:test:e2e

      - name: Platform API e2e tests
        run: pnpm platform:test:e2e

# CI/CD: build образів → deploy у Docker Swarm через docker context over SSH.
#
# Транспорт: раннер створює docker-context на manager по SSH; `docker stack deploy`
# читає stack-файл ЛОКАЛЬНО, інтерполює ${...} з оточення job-а й шле spec на manager.
# НА СЕРВЕР НЕ КОПІЮЮТЬСЯ ФАЙЛИ (ні stack, ні .env, ні config.json).
#
# SSH між раннером і manager-ом УЖЕ налаштований (ключ/known_hosts на рівні раннера) —
# у CI ключ НЕ інжектимо. Job-и деплою приземляються на цей раннер через runner-теги
# (deploy_dev / deploy_prod — скоригуй під імена ваших раннерів).
#
# Registry: build-джоби логіняться предефайненим job-token'ом (CI_REGISTRY_USER/PASSWORD).
# Deploy — Deploy Token'ом (REGISTRY_DEPLOY_USER/PASSWORD, скоуп read_registry), якщо він заданий.
# ЧОМУ: job-token дійсний рівно поки живе job. `stack deploy` лише СТАВИТЬ ЗАВДАННЯ, а pull
# робить swarm-агент асинхронно — і те, що не встигло до кінця джоби, ловить від реєстру
# 401 «HTTP Basic: Access denied» → «No such image» → тихий rollback на старий образ.
# Спіймано наживо 2026-08-29: два деплої поспіль показали зелену джобу, а web і platform-api
# лишились на образі 13-денної давнини. Тому тут три незалежні запобіжники: довговічні креди,
# синхронний передпул у межах джоби і пост-перевірка фактичного образу сервісів.
#
# --- CI/CD Variables (серверні — «як є», ті самі, що в accounting; не в репо) ---
#   DEPLOY_USER_DEV / _PROD    ssh-юзер manager-а
#   DEPLOY_HOST_DEV / _PROD    хост/IP manager-а
#   DEPLOY_PORT_DEV / _PROD    ssh-порт (дефолт 22)
#   → з них будується docker-context: host=ssh://$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT
#   REGISTRY_DEPLOY_USER       логін Deploy Token'а (Settings → Repository → Deploy tokens,
#   REGISTRY_DEPLOY_PASSWORD   скоуп read_registry; обидві masked). Не задані → фолбек на
#                              job-token із гучним попередженням у логу джоби.
#
# Прикладні секрети/конфіг стеку (JWT, S3, SMTP, пароль БД) — у КОМІТНУТОМУ docker/deploy.env
# (тестовий прод, свідомо в репо). Ключі сховища — docker/seaweedfs/s3.prod.json (теж у репо).
# Для справжнього проду ці два файли винести в CI Variables і розігнорувати назад.

stages:
  - check
  - build
  - deploy_dev
  - deploy_prod

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  API_IMAGE_BASE:          "$CI_REGISTRY_IMAGE/api"
  PLATFORM_API_IMAGE_BASE: "$CI_REGISTRY_IMAGE/platform-api"
  WORKER_IMAGE_BASE:       "$CI_REGISTRY_IMAGE/worker"
  WEB_IMAGE_BASE:          "$CI_REGISTRY_IMAGE/web"
  PLATFORM_WEB_IMAGE_BASE: "$CI_REGISTRY_IMAGE/platform-web"
  TOOLS_IMAGE_BASE:        "$CI_REGISTRY_IMAGE/tools"

# ===========================================================================
# CHECK — дешеві перевірки ДО збірки образів: провал зупиняє пайплайн раніше, ніж
# будь-що збиралось чи деплоїлось.
# ===========================================================================
# Корпус знань AI (docs/ai-assistant.md §7.2, ai-1b design.md D5): закомічений артефакт
# не розійшовся з docs/ai-knowledge, front-matter валідний, корпус у бюджеті символів.
# shell-executor: `image:` ігнорується, Node на хості не гарантований — тому стоковий
# node:24 (та сама база, що в Dockerfile.node) з read-only bind-mount-ом checkout-у.
# Скрипт не має залежностей: жодного `pnpm install`.
ai_knowledge_check:
  stage: check
  tags: [deploy_dev]
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/repo:ro" -w /repo node:24-bookworm-slim node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ai-knowledge.ts --check

# Повна перевірка коміту: lint (+ deps:check) → typecheck → unit → e2e обох API проти
# одноразових Postgres (pgvector) і Valkey. Стадія build стартує лише після зеленої check,
# тож неперевірений SHA не збирається і не деплоїться. Уся логіка — у скрипті, щоб локальний
# прогін (`bash scripts/ci-verify.sh`) був тим самим, що тут.
verify:
  stage: check
  tags: [deploy_dev]
  rules:
    - if: $CI_COMMIT_BRANCH
  timeout: 45m
  script:
    - bash scripts/ci-verify.sh

# ===========================================================================
# BUILD — усі образи паралельно (dind + BuildKit). Тег = $CI_COMMIT_SHA (+latest на default).
# ===========================================================================
.build_base:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_BUILDKIT: "1"
  tags: [deploy_dev]      # ТИМЧАСОВО: усе (в т.ч. prod) під deploy_dev-раннерами
  rules:
    # main поки не деплоїться (див. .prod_disabled нижче) — образи для нього не потрібні
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  # shell-executor: `docker build` іде на локальному демоні раннера, і нічого звідти не зникає —
  # 20G том забивається за кілька пайплайнів, після чого build падає з ENOSPC ще на `pnpm install`.
  # Головний пожирач — НЕ образи, а BuildKit-кеш: на 2026-07-31 образи займали 2GB, кеш — 19.7GB
  # (у демона немає ліміту `builder.gc.defaultKeepStorage`), тому самого `image prune` мало.
  # Образи вже в registry — локально тримаємо лише поточний SHA (+latest); кеш лишаємо за добу,
  # щоб не втрачати швидкість збірки. Обмежено namespace-ом $CI_REGISTRY_IMAGE — сусідні проєкти
  # на тому ж раннері не чіпаємо.
  after_script:
    - docker images "$CI_REGISTRY_IMAGE/*" --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>' | grep -v ":$CI_COMMIT_SHA$" | grep -v ':latest$' | xargs -r docker rmi || true
    - docker image prune -f || true
    - docker builder prune -f --filter "until=24h" || true
  artifacts:
    reports:
      dotenv: build.env

build_api:
  extends: .build_base
  script:
    - docker build -f Dockerfile.node --build-arg APP=api -t "$API_IMAGE_BASE:$CI_COMMIT_SHA" .
    - docker push "$API_IMAGE_BASE:$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$API_IMAGE_BASE:$CI_COMMIT_SHA" "$API_IMAGE_BASE:latest" && docker push "$API_IMAGE_BASE:latest"; fi
    - echo "API_IMAGE=$API_IMAGE_BASE:$CI_COMMIT_SHA" >> build.env

build_platform_api:
  extends: .build_base
  script:
    - docker build -f Dockerfile.node --build-arg APP=platform-api -t "$PLATFORM_API_IMAGE_BASE:$CI_COMMIT_SHA" .
    - docker push "$PLATFORM_API_IMAGE_BASE:$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$PLATFORM_API_IMAGE_BASE:$CI_COMMIT_SHA" "$PLATFORM_API_IMAGE_BASE:latest" && docker push "$PLATFORM_API_IMAGE_BASE:latest"; fi
    - echo "PLATFORM_API_IMAGE=$PLATFORM_API_IMAGE_BASE:$CI_COMMIT_SHA" >> build.env

build_worker:
  extends: .build_base
  script:
    - docker build -f Dockerfile.node --build-arg APP=worker -t "$WORKER_IMAGE_BASE:$CI_COMMIT_SHA" .
    - docker push "$WORKER_IMAGE_BASE:$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$WORKER_IMAGE_BASE:$CI_COMMIT_SHA" "$WORKER_IMAGE_BASE:latest" && docker push "$WORKER_IMAGE_BASE:latest"; fi
    - echo "WORKER_IMAGE=$WORKER_IMAGE_BASE:$CI_COMMIT_SHA" >> build.env

build_web:
  extends: .build_base
  script:
    - docker build -f Dockerfile.web --build-arg APP=web -t "$WEB_IMAGE_BASE:$CI_COMMIT_SHA" .
    - docker push "$WEB_IMAGE_BASE:$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$WEB_IMAGE_BASE:$CI_COMMIT_SHA" "$WEB_IMAGE_BASE:latest" && docker push "$WEB_IMAGE_BASE:latest"; fi
    - echo "WEB_IMAGE=$WEB_IMAGE_BASE:$CI_COMMIT_SHA" >> build.env

build_platform_web:
  extends: .build_base
  script:
    - docker build -f Dockerfile.web --build-arg APP=platform-web -t "$PLATFORM_WEB_IMAGE_BASE:$CI_COMMIT_SHA" .
    - docker push "$PLATFORM_WEB_IMAGE_BASE:$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$PLATFORM_WEB_IMAGE_BASE:$CI_COMMIT_SHA" "$PLATFORM_WEB_IMAGE_BASE:latest" && docker push "$PLATFORM_WEB_IMAGE_BASE:latest"; fi
    - echo "PLATFORM_WEB_IMAGE=$PLATFORM_WEB_IMAGE_BASE:$CI_COMMIT_SHA" >> build.env

build_tools:
  extends: .build_base
  script:
    - docker build -f Dockerfile.tools -t "$TOOLS_IMAGE_BASE:$CI_COMMIT_SHA" .
    - docker push "$TOOLS_IMAGE_BASE:$CI_COMMIT_SHA"
    - echo "TOOLS_IMAGE=$TOOLS_IMAGE_BASE:$CI_COMMIT_SHA" >> build.env

# ===========================================================================
# DEPLOY — docker context over SSH. Спільна логіка; середовища відрізняються variables.
# ===========================================================================
.deploy_base:
  image: docker:27
  needs:
    - { job: build_api, artifacts: true }
    - { job: build_platform_api, artifacts: true }
    - { job: build_worker, artifacts: true }
    - { job: build_web, artifacts: true }
    - { job: build_platform_web, artifacts: true }
  before_script:
    # SSH раннер↔manager уже налаштований → ключ не інжектимо. Лише ssh-клієнт + context.
    # shell-executor: хост уже має docker+ssh (apk не потрібен). Context ідемпотентний — стан
    # раннера персистентний між job-ами, тож перестворюємо, щоб не падати на «вже існує».
    - docker context rm -f swarm 2>/dev/null || true
    - docker context create swarm --docker "host=ssh://$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PORT:-22}"
    # Логін у реєстр. ПРІОРИТЕТ — Deploy Token (скоуп read_registry): його креди довговічні,
    # тому лишаються валідними й тоді, коли нода піде пулити образ ПІСЛЯ завершення джоби
    # (retry таска, ручний `service update`, друга нода). Предефайнений job-token живе рівно
    # стільки, скільки job, після чого реєстр віддає 401 «HTTP Basic: Access denied».
    - |
      set -e
      if [ -n "$REGISTRY_DEPLOY_USER" ] && [ -n "$REGISTRY_DEPLOY_PASSWORD" ]; then
        echo "$REGISTRY_DEPLOY_PASSWORD" | docker login "$CI_REGISTRY" -u "$REGISTRY_DEPLOY_USER" --password-stdin
      else
        echo "УВАГА: REGISTRY_DEPLOY_USER/REGISTRY_DEPLOY_PASSWORD не задані — логінимось job-token'ом."
        echo "       Передпул у script робить деплой працездатним і так, але роздані нодам креди"
        echo "       протухнуть разом із джобою. Заведи Deploy Token — docs/deploy-swarm.md §7."
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      fi
    # прикладні секрети з комітнутого файлу → у оточення job-а (для інтерполяції ${...} у стеку)
    - set -a; . ./docker/deploy.env; set +a
  script:
    # 1) ПЕРЕДПУЛ образів на manager — синхронно, в межах живої джоби, fail-fast.
    #    Без нього pull робить swarm-агент АСИНХРОННО вже після `stack deploy`, і будь-яка
    #    причина, через яку pull не встигає (протухлий job-token, повний диск), дає
    #    «No such image» → мовчазний rollback на старий образ. Тут же помилка реєстру
    #    видна одразу і валить джобу до того, як стек чіпали.
    - |
      set -e
      for img in "$API_IMAGE" "$PLATFORM_API_IMAGE" "$WORKER_IMAGE" "$WEB_IMAGE" "$PLATFORM_WEB_IMAGE"; do
        echo "→ pull $img"
        DOCKER_CONTEXT=swarm docker pull --quiet "$img"
      done
    # 2) Розкат. --detach=false: джоба чекає конвергенції, а не завершується одразу.
    - |
      set -e
      echo "Deploy → context=swarm  stack=$STACK_NAME"
      DOCKER_CONTEXT=swarm docker stack deploy \
        --with-registry-auth --detach=false --prune \
        -c docker/docker-compose.stack.yml "$STACK_NAME"
    # 3) Пост-перевірка: сервіс мусить крутитися САМЕ на щойно зібраному образі.
    #    Саме її браку вистачило, щоб два провальні деплої поспіль виглядали зеленими:
    #    failure_action=rollback повертає старий образ, а джоба про це не дізнається.
    - |
      set -e
      failed=0
      check_service() {
        expected="$2"
        actual=$(DOCKER_CONTEXT=swarm docker service inspect "${STACK_NAME}_$1" \
          --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
        case "$actual" in
          "$expected"|"$expected"@*) echo "  ok    $1 → $expected" ;;
          *) echo "  FAIL  $1: очікували $expected, фактично $actual"; failed=1 ;;
        esac
      }
      check_service api          "$API_IMAGE"
      check_service platform-api "$PLATFORM_API_IMAGE"
      check_service worker       "$WORKER_IMAGE"
      check_service web          "$WEB_IMAGE"
      check_service platform-web "$PLATFORM_WEB_IMAGE"
      DOCKER_CONTEXT=swarm docker stack ps "$STACK_NAME" --filter desired-state=running
      if [ "$failed" -ne 0 ]; then
        echo "Деплой НЕ розкотився: swarm відкотив частину сервісів на попередній образ."
        exit 1
      fi

deploy_dev:
  extends: .deploy_base
  stage: deploy_dev
  tags: [deploy_dev]
  environment: { name: dev }
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  variables:
    STACK_NAME: saas-dev
    DEPLOY_USER: $DEPLOY_USER_DEV
    DEPLOY_HOST: $DEPLOY_HOST_DEV
    DEPLOY_PORT: $DEPLOY_PORT_DEV
    SAAS_DATA_DIR: /srv/saas-dev/data
    # прикладні секрети — з docker/deploy.env (source у before_script)

# PROD ВИМКНЕНО (2026-10-05). Розробка йде в `dev` (головна гілка, деплой → saas-dev);
# `main` — дзеркало, яке синхронізуємо з `dev`, але НЕ деплоїмо: на ньому біжить лише стадія
# check. Усі prod-джоби нижче успадковують ці rules. Щоб увімкнути prod:
#   1) тут замінити `when: never` на `if: '$CI_COMMIT_BRANCH == "main"'` + `when: manual`;
#   2) прибрати виняток для main у .build_base.rules.
# Гілка вказана явно, а не через $CI_DEFAULT_BRANCH: якщо default у GitLab стане `dev`,
# prod-джоби не мають причепитися до dev-пайплайнів. Деталі — docs/deploy-swarm.md.
.prod_disabled:
  rules:
    - when: never

deploy_prod:
  extends: [.deploy_base, .prod_disabled]
  stage: deploy_prod
  tags: [deploy_dev]
  environment: { name: production }
  variables:
    STACK_NAME: saas-prod
    DEPLOY_USER: $DEPLOY_USER_PROD
    DEPLOY_HOST: $DEPLOY_HOST_PROD
    DEPLOY_PORT: $DEPLOY_PORT_PROD
    SAAS_DATA_DIR: /srv/saas-prod/data
    # прикладні секрети — з docker/deploy.env (source у before_script)

# ===========================================================================
# ONE-SHOT (manual): db:roles → ДО першого деплою; seed → демо-дані; dump → бекап БД.
# Виконуються на manager через context (docker run/exec по overlay-мережі стеку).
# ===========================================================================
.tools_base:
  image: docker:27
  when: manual
  tags: [deploy_dev]
  needs:
    - { job: build_tools, artifacts: true }
  before_script:
    # shell-executor: хост уже має docker+ssh (apk не потрібен). Context ідемпотентний — стан
    # раннера персистентний між job-ами, тож перестворюємо, щоб не падати на «вже існує».
    - docker context rm -f swarm 2>/dev/null || true
    - docker context create swarm --docker "host=ssh://$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PORT:-22}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - set -a; . ./docker/deploy.env; set +a

db_roles_prod:
  extends: [.tools_base, .prod_disabled]
  stage: deploy_prod
  needs:
    - { job: build_tools, artifacts: true }
    - { job: deploy_prod }
  variables:
    STACK_NAME: saas-prod
    DEPLOY_USER: $DEPLOY_USER_PROD
    DEPLOY_HOST: $DEPLOY_HOST_PROD
    DEPLOY_PORT: $DEPLOY_PORT_PROD
  script:
    - |
      for i in $(seq 1 30); do
        DOCKER_CONTEXT=swarm docker run --rm --network ${STACK_NAME}_saas_net \
          -e POSTGRES_ADMIN_URL="postgresql://saas:${POSTGRES_PASSWORD}@postgres:5432/postgres" \
          -e DATABASE_URL="postgresql://saas_app:saas_app@postgres:5432/saas_skeleton" \
          "$TOOLS_IMAGE" pnpm db:roles && exit 0
        echo "[db_roles] postgres ще не готовий (спроба $i/30) — чекаю 5с…"; sleep 5
      done
      echo "[db_roles] не вдалося за 30 спроб — перевір: docker service ps saas-prod_postgres"; exit 1

seed_prod:
  extends: [.tools_base, .prod_disabled]
  stage: deploy_prod
  needs:
    - { job: build_tools, artifacts: true }
    - { job: deploy_prod }
  variables:
    STACK_NAME: saas-prod
    DEPLOY_USER: $DEPLOY_USER_PROD
    DEPLOY_HOST: $DEPLOY_HOST_PROD
    DEPLOY_PORT: $DEPLOY_PORT_PROD
  script:
    - |
      DOCKER_CONTEXT=swarm docker run --rm --network ${STACK_NAME}_saas_net \
        -e PLATFORM_DATABASE_URL="postgresql://saas_platform:saas_platform@postgres:5432/saas_skeleton" \
        "$TOOLS_IMAGE" pnpm db:seed

db_roles_dev:
  extends: .tools_base
  stage: deploy_prod
  rules:                       # лише там, де є deploy_dev (needs нижче), інакше пайплайн не створиться
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
  needs:                       # мусить чекати deploy_dev — інакше мережі saas-dev_saas_net ще нема
    - { job: build_tools, artifacts: true }
    - { job: deploy_dev }
  variables:
    STACK_NAME: saas-dev
    DEPLOY_USER: $DEPLOY_USER_DEV
    DEPLOY_HOST: $DEPLOY_HOST_DEV
    DEPLOY_PORT: $DEPLOY_PORT_DEV
  script:
    - |
      for i in $(seq 1 30); do
        DOCKER_CONTEXT=swarm docker run --rm --network ${STACK_NAME}_saas_net \
          -e POSTGRES_ADMIN_URL="postgresql://saas:${POSTGRES_PASSWORD}@postgres:5432/postgres" \
          -e DATABASE_URL="postgresql://saas_app:saas_app@postgres:5432/saas_skeleton" \
          "$TOOLS_IMAGE" pnpm db:roles && exit 0
        echo "[db_roles] postgres ще не готовий (спроба $i/30) — чекаю 5с…"; sleep 5
      done
      echo "[db_roles] не вдалося за 30 спроб — перевір: docker service ps saas-dev_postgres"; exit 1

seed_dev:
  extends: .tools_base
  stage: deploy_prod
  rules:                       # лише там, де є deploy_dev (needs нижче), інакше пайплайн не створиться
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
  needs:
    - { job: build_tools, artifacts: true }
    - { job: deploy_dev }
  variables:
    STACK_NAME: saas-dev
    DEPLOY_USER: $DEPLOY_USER_DEV
    DEPLOY_HOST: $DEPLOY_HOST_DEV
    DEPLOY_PORT: $DEPLOY_PORT_DEV
  script:
    - |
      DOCKER_CONTEXT=swarm docker run --rm --network ${STACK_NAME}_saas_net \
        -e PLATFORM_DATABASE_URL="postgresql://saas_platform:saas_platform@postgres:5432/saas_skeleton" \
        "$TOOLS_IMAGE" pnpm db:seed

dump_db_prod:
  extends: .prod_disabled
  image: docker:27
  stage: deploy_prod
  when: manual
  tags: [deploy_dev]
  variables:
    STACK_NAME: saas-prod
    DEPLOY_USER: $DEPLOY_USER_PROD
    DEPLOY_HOST: $DEPLOY_HOST_PROD
    DEPLOY_PORT: $DEPLOY_PORT_PROD
  before_script:
    # shell-executor: хост уже має docker+ssh (apk не потрібен). Context ідемпотентний — стан
    # раннера персистентний між job-ами, тож перестворюємо, щоб не падати на «вже існує».
    - docker context rm -f swarm 2>/dev/null || true
    - docker context create swarm --docker "host=ssh://$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PORT:-22}"
  script:
    - |
      CID=$(DOCKER_CONTEXT=swarm docker ps --filter "name=${STACK_NAME}_postgres" --format '{{.ID}}' | head -1)
      DUMP="saas_dump_$(date +%Y%m%d_%H%M%S).sql"
      DOCKER_CONTEXT=swarm docker exec "$CID" pg_dump -U saas -d saas_skeleton > "$DUMP"
      ls -lh "$DUMP"
  artifacts:
    name: "saas_db_dump_prod"
    paths: ["*.sql"]
    expire_in: 7 days
    when: always
